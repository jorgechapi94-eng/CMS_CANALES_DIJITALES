# ─────────────────────────────────────────────────────────────
# Nginx Reverse Proxy - Portal Web UPEC
# Unifica: SPA Frontend + API Flask + Stream Icecast + Uploads
# ─────────────────────────────────────────────────────────────

upstream flask_backend {
    server backend:5000;
}

upstream vue_frontend {
    server frontend:5173;
}

server {
    listen 80;
    server_name localhost;

    # Tamaño máximo de subida (PDFs, imágenes)
    client_max_body_size 25M;

    # ─── SPA Frontend ─────────────────────────────────────────
    location / {
        proxy_pass http://vue_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Flask REST API ───────────────────────────────────────
    location /api/ {
        proxy_pass http://flask_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout para uploads grandes
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ─── Archivos estáticos (uploads) ─────────────────────────
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;

        # Tipos MIME explícitos
        types {
            application/pdf  pdf;
            image/jpeg       jpg jpeg;
            image/png        png;
            image/webp       webp;
            image/gif        gif;
        }
    }

    # ─── Icecast Audio Stream Proxy (CRÍTICO) ─────────────────
    # Resuelve bloqueo Mixed Content HTTPS en navegadores
    location /radio-stream/ {
        # Apuntar al servidor Icecast interno o externo
        # En Docker: usar host.docker.internal o la IP del host
        proxy_pass http://host.docker.internal:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # CRÍTICO: Sin buffering para streaming en tiempo real
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_ignore_client_abort off;

        # Mantener conexión abierta para stream continuo (24h)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Optimización TCP para latencia mínima
        tcp_nodelay on;

        # No cachear el stream
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # ─── Seguridad básica ─────────────────────────────────────
    # Ocultar versión de Nginx
    server_tokens off;

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Bloquear archivos ocultos
    location ~ /\. {
        deny all;
        return 404;
    }
}
