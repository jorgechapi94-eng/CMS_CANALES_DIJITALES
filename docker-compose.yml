version: '3.8'

services:
  # ─── MySQL 8.0 ───────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: upec-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-upec2024}
      MYSQL_DATABASE: upec_cms_db
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Flask Backend (API REST) ────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: upec-backend
    restart: unless-stopped
    environment:
      FLASK_CONFIG: development
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-jwt-secret}
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-upec2024}@mysql:3306/upec_cms_db
      UPLOAD_FOLDER: /app/uploads
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_CHANNEL_ID: ${YOUTUBE_CHANNEL_ID:-}
      YOUTUBE_UPLOADS_PLAYLIST_ID: ${YOUTUBE_UPLOADS_PLAYLIST_ID:-}
      ICECAST_STATUS_URL: ${ICECAST_STATUS_URL:-http://host.docker.internal:8000/status-json.xsl}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:80}
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "
        flask db upgrade 2>/dev/null || (flask db init && flask db migrate -m 'initial' && flask db upgrade) &&
        python -c 'from app.seeds.initial_data import seed_all; seed_all()' 2>/dev/null;
        gunicorn --config gunicorn.conf.py wsgi:application
      "

  # ─── Vue 3 Frontend (Dev Server) ────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: upec-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  # ─── Nginx Reverse Proxy (Production-like) ──────────────────
  nginx:
    image: nginx:alpine
    container_name: upec-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/upec_portal.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/var/www/uploads:ro
    depends_on:
      - backend
      - frontend

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local
